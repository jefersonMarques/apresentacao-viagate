<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071827" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>ViaGate — Proposta Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./proposal.css" />
  <link rel="stylesheet" href="./proposal-view.css?v=20260825-7" />
  <link rel="stylesheet" href="../viewer-active.css?v=20260825-2" />
  <link rel="stylesheet" href="./proposal-premium.css?v=20260825-1" />
</head>
<body class="public-proposal proposal-locked">
  <div class="loading-screen" id="proposalLoading">Carregando proposta...</div>

  <main id="proposalPresentation" hidden></main>

  <div class="proposal-view-gate" id="proposalGate" role="dialog" aria-modal="true" aria-label="Controle da proposta">
    <div class="proposal-view-action">
      <div class="proposal-view-action-row">
        <button class="proposal-view-button secondary" id="proposalRestartButton" type="button" hidden>VOLTAR AO INÍCIO</button>
        <button class="proposal-view-button" id="proposalStartButton" type="button" data-proposal-start>VER PROPOSTA</button>
      </div>
      <img class="proposal-view-logo" src="../assets/logo-viagate-white.svg" alt="ViaGate" />
    </div>
  </div>

  <div class="proposal-view-navigation" id="proposalControls" aria-label="Navegação da proposta" hidden>
    <button type="button" data-proposal-previous aria-label="Slide anterior">↑</button>
    <span data-proposal-counter>01 / 01</span>
    <button type="button" data-proposal-next aria-label="Próximo slide">↓</button>
  </div>

  <script type="module" src="./view-secure.js?v=20260825-1"></script>
</body>
</html>
