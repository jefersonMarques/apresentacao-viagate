<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071827" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>ViaGate — Proposta Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./proposal.css" />
</head>
<body class="public-proposal">
  <div class="loading-screen" id="proposalLoading">Carregando proposta...</div>
  <main id="proposalPresentation" hidden></main>
  <div class="proposal-floating-controls" id="proposalControls" hidden>
    <button type="button" data-proposal-previous aria-label="Slide anterior">‹</button>
    <span data-proposal-counter>01 / 01</span>
    <button type="button" data-proposal-next aria-label="Próximo slide">›</button>
    <button type="button" data-proposal-fullscreen aria-label="Alternar tela cheia">⛶</button>
  </div>
  <script type="module" src="./view.js"></script>
</body>
</html>
