<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071827" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>ViaGate — Apresentação</title>
  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071827;
    }

    .presentation-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #071827;
      transition: filter 280ms ease, transform 280ms ease;
    }

    body.is-paused .presentation-frame {
      filter: blur(14px) brightness(.68);
      transform: scale(1.012);
      pointer-events: none;
    }

    .presentation-gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: rgba(3, 14, 24, .18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    body.is-paused .presentation-gate {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .presentation-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .presentation-action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .presentation-button {
      min-width: 290px;
      min-height: 62px;
      padding: 0 30px;
      border: 1px solid #ff6b18;
      background: #ff6b18;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
      transition: background 180ms ease, transform 180ms ease;
    }

    .presentation-button:hover:not(:disabled) {
      background: #df5208;
      transform: translateY(-2px);
    }

    .presentation-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .presentation-button.secondary {
      min-width: 190px;
      border-color: rgba(255, 255, 255, .28);
      background: rgba(7, 24, 39, .7);
      box-shadow: none;
    }

    .presentation-button.secondary:hover {
      background: rgba(255, 255, 255, .08);
    }

    .presentation-logo {
      width: 128px;
      height: auto;
      opacity: .34;
      pointer-events: none;
      user-select: none;
    }

    .presentation-navigation {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 900;
      display: inline-flex;
      align-items: center;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(7, 24, 39, .86);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .24);
    }

    .presentation-navigation[hidden] {
      display: none;
    }

    .presentation-navigation button {
      width: 46px;
      height: 44px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
    }

    .presentation-navigation button:hover:not(:disabled) {
      background: rgba(255, 255, 255, .08);
    }

    .presentation-navigation button:disabled {
      opacity: .3;
      cursor: default;
    }

    .presentation-navigation span {
      min-width: 88px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid rgba(255, 255, 255, .12);
      border-right: 1px solid rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .78);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      place-items: center;
      background: #071827;
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .loading[hidden] {
      display: none;
    }

    .error {
      max-width: 520px;
      padding: 24px;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .presentation-action-row {
        width: min(92vw, 340px);
      }

      .presentation-button,
      .presentation-button.secondary {
        width: 100%;
        min-width: 0;
      }

      .presentation-navigation {
        bottom: 14px;
      }
    }
  </style>
</head>
<body class="is-paused">
  <div class="loading" id="presentationLoading">Carregando apresentação...</div>

  <iframe
    class="presentation-frame"
    id="presentationFrame"
    title="Apresentação ViaGate"
    allow="fullscreen"
    hidden
  ></iframe>

  <div class="presentation-gate" id="presentationGate" role="dialog" aria-modal="true" aria-label="Controle da apresentação">
    <div class="presentation-action">
      <div class="presentation-action-row">
        <button class="presentation-button secondary" id="presentationRestartButton" type="button" hidden>VOLTAR AO INÍCIO</button>
        <button class="presentation-button" id="presentationStartButton" type="button">INICIAR APRESENTAÇÃO</button>
      </div>
      <img class="presentation-logo" src="./assets/logo-viagate-white.svg" alt="ViaGate" />
    </div>
  </div>

  <div class="presentation-navigation" id="presentationNavigation" aria-label="Navegação da apresentação" hidden>
    <button id="presentationPreviousButton" type="button" aria-label="Slide anterior">↑</button>
    <span id="presentationCounter">01 / 01</span>
    <button id="presentationNextButton" type="button" aria-label="Próximo slide">↓</button>
  </div>

  <script type="module" src="./presentation-view.js?v=20260825-9"></script>
</body>
</html>
