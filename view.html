<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071827" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>ViaGate — Apresentação</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071827;font-family:Inter,Arial,sans-serif}.presentation-frame{display:block;width:100%;height:100%;border:0;background:#071827;transition:filter .28s ease,transform .28s ease}body.is-paused .presentation-frame{filter:blur(14px) brightness(.68);transform:scale(1.012);pointer-events:none}.presentation-gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:rgba(3,14,24,.18);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility .22s ease}body.is-paused .presentation-gate{opacity:1;visibility:visible;pointer-events:auto}.presentation-action{display:flex;flex-direction:column;align-items:center;gap:22px}.presentation-button{min-width:290px;min-height:62px;padding:0 30px;border:1px solid #ff6b18;background:#ff6b18;color:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 18px 50px rgba(0,0,0,.24)}.presentation-logo{width:128px;height:auto;opacity:.34;pointer-events:none}.loading{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;background:#071827;color:rgba(255,255,255,.7);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.loading[hidden]{display:none}.error{max-width:520px;padding:24px;text-align:center;line-height:1.6}
  </style>
</head>
<body class="is-paused">
  <div class="loading" id="presentationLoading">Carregando apresentação...</div>
  <iframe class="presentation-frame" id="presentationFrame" title="Apresentação ViaGate" allow="fullscreen" allowfullscreen hidden></iframe>
  <div class="presentation-gate" id="presentationGate">
    <div class="presentation-action">
      <button class="presentation-button" id="presentationStartButton" type="button">INICIAR APRESENTAÇÃO</button>
      <img class="presentation-logo" src="./assets/logo-viagate-white.svg" alt="ViaGate" />
    </div>
  </div>
  <script type="module" src="./presentation-view.js"></script>
</body>
</html>
