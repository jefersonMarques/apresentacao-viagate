<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071827" />
  <title>ViaGate — Apresentação Institucional</title>
  <meta name="description" content="Apresentação institucional ViaGate — validação, análise de risco e operação logística." />
  <link rel="canonical" href="https://viagate.com.br/apresentacao" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071827;
    }

    .presentation-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #071827;
    }
  </style>
</head>
<body>
  <iframe
    class="presentation-frame"
    id="presentationFrame"
    src="./presentation-content.html"
    title="Apresentação Institucional ViaGate"
    allow="fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    const frame = document.getElementById('presentationFrame');

    frame.addEventListener('load', () => {
      const frameDocument = frame.contentDocument;
      const frameWindow = frame.contentWindow;

      if (!frameDocument || !frameWindow) {
        return;
      }

      const styleLink = frameDocument.createElement('link');
      styleLink.rel = 'stylesheet';
      styleLink.href = './presentation-mode.css';
      frameDocument.head.appendChild(styleLink);

      const presentationScript = frameDocument.createElement('script');
      presentationScript.src = './presentation-mode.js';
      presentationScript.addEventListener('load', () => {
        if (typeof frameWindow.initializePresentationMode === 'function') {
          frameWindow.initializePresentationMode();
        }
      });
      frameDocument.body.appendChild(presentationScript);
    }, { once: true });
  </script>
</body>
</html>
